name: Validate and build desktop candidates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run setup:ocr
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - if: runner.os == 'Windows'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Test packaged Linux application
        if: runner.os == 'Linux'
        env:
          FINANCE_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release/linux-unpacked/domace-financie
        run: xvfb-run -a npm run test:packaged
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        env:
          FINANCE_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/Domáce Financie.exe
        run: npm run test:packaged
      - name: Install Linux package and test without external networking
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y ./release/*.deb
          installed=$(dpkg-query -L domace-financie | sed -n '/\/domace-financie$/p' | head -n 1)
          test -x "$installed"
          FINANCE_PACKAGED_EXECUTABLE="$installed" bash scripts/test-offline-linux.sh
      - name: Install Windows package and test installed application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'finance-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:FINANCE_PACKAGED_EXECUTABLE = Join-Path $install 'Domáce Financie.exe'
          if (!(Test-Path $env:FINANCE_PACKAGED_EXECUTABLE)) { throw 'Installed executable missing' }
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/SHA256SUMS.txt
            release/THIRD_PARTY_NOTICES.txt
      - name: Save synthetic desktop test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
